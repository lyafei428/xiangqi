name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 的官方发布动作要这三个权限，少一个 upload 会被拒。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一趟：连推两次时，先跑完的那趟产物不该盖掉后一趟。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 部署前先过一遍闸门：类型 + 单测 + 前端用例，红了就不发。
      - run: npm run check

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
